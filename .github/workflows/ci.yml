name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv .tmp/wheel-env
          .tmp/wheel-env/bin/python -m pip install dist/*.whl
          mkdir -p .tmp/wheel-smoke
          cd .tmp/wheel-smoke
          ../wheel-env/bin/python ../../tests/smoke_installed.py
      - name: Verify installed source archive outside checkout
        run: |
          python -m venv .tmp/sdist-env
          .tmp/sdist-env/bin/python -m pip install dist/*.tar.gz
          mkdir -p .tmp/sdist-smoke
          cd .tmp/sdist-smoke
          ../sdist-env/bin/python ../../tests/smoke_installed.py
