[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imagescope"
version = "0.1.0"
description = "Stateless local image recognition and pixel measurements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
imagescope = "imagescope.cli:main"

[tool.setuptools]
packages = ["imagescope", "imagescope.backends", "imagescope.profiles"]
