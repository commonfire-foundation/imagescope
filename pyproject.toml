[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imagescope"
version = "0.1.0rc2"
description = "Stateless local image recognition and pixel measurements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "numpy>=1.26"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/commonfire-foundation/imagescope"
Issues = "https://github.com/commonfire-foundation/imagescope/issues"
Changelog = "https://github.com/commonfire-foundation/imagescope/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
imagescope = "imagescope.cli:main"

[tool.setuptools]
packages = ["imagescope", "imagescope.backends", "imagescope.profiles"]
